global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["172.28.0.40:9093"]

scrape_configs:
  - job_name: "aiops_agent"
    static_configs:
      - targets: ["172.28.0.1:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
