global:
  resolve_timeout: 30s

route:
  group_by: ["alertname", "severity"]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 15m
  receiver: "aiops-telegram-bridge"

receivers:
  - name: "aiops-telegram-bridge"
    webhook_configs:
      - url: "http://172.28.0.1:8000/alertmanager-webhook"
        send_resolved: true
