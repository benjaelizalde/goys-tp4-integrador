<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1100" width="980" height="1100" font-family="Arial, Liberation Sans, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f2942"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
  </defs>

  <!-- Fondo blanco limpio para exportación independiente -->
  <rect x="0" y="0" width="980" height="1100" rx="14" fill="#ffffff"/>

  <!-- Fila 0: actores externos al host -->
  <rect x="15" y="10" width="435" height="110" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="4"/>
  <text x="232" y="55" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f2942">Clientes Legítimos</text>
  <text x="232" y="95" text-anchor="middle" font-size="20" font-weight="bold" fill="#15803d">localhost:8080 → DNAT → .0.10:80</text>

  <rect x="570" y="10" width="395" height="110" rx="14" fill="#f8fafc" stroke="#0284c7" stroke-width="4" stroke-dasharray="12,6"/>
  <text x="767" y="55" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f2942">Groq API (Internet)</text>
  <text x="767" y="95" text-anchor="middle" font-size="23" fill="#334155">HTTPS · dictamen JSON</text>

  <!-- Host Linux: Suricata y Agente comparten su red -->
  <rect x="8" y="160" width="964" height="932" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="3.5" stroke-dasharray="14,8"/>
  <text x="100" y="196" font-size="22" font-weight="bold" fill="#475569">HOST LINUX · network_mode: host</text>

  <!-- Fila 1: contenedores en modo host -->
  <rect x="110" y="215" width="360" height="170" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
  <text x="290" y="262" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f2942">Sensor IDS (SOC)</text>
  <text x="290" y="302" text-anchor="middle" font-size="24" font-weight="bold" fill="#0284c7">Suricata 8.0</text>
  <text x="290" y="342" text-anchor="middle" font-size="22" fill="#334155">local.rules → eve.json</text>

  <rect x="570" y="215" width="380" height="170" rx="14" fill="#eff6ff" stroke="#0284c7" stroke-width="4"/>
  <text x="760" y="262" text-anchor="middle" font-size="28" font-weight="bold" fill="#0f2942">Agente AIOps</text>
  <text x="760" y="302" text-anchor="middle" font-size="24" font-weight="bold" fill="#0284c7">Python + Groq LLM</text>
  <text x="760" y="342" text-anchor="middle" font-size="22" fill="#334155">iptables · /metrics :8000</text>

  <!-- Suricata -> Agente (archivo compartido) -->
  <line x1="470" y1="300" x2="566" y2="300" stroke="#0284c7" stroke-width="4.5" marker-end="url(#arr-blue)"/>
  <text x="520" y="285" text-anchor="middle" font-size="18.5" font-weight="bold" fill="#0284c7">eve.json</text>

  <!-- Agente <-> Groq -->
  <line x1="767" y1="124" x2="767" y2="211" stroke="#0284c7" stroke-width="4" stroke-dasharray="9,6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>

  <!-- Clientes -> Bridge (entran por el host) -->
  <line x1="60" y1="120" x2="60" y2="510" stroke="#15803d" stroke-width="4.5" marker-end="url(#arr-green)"/>
  <text x="40" y="330" text-anchor="middle" font-size="21" font-weight="bold" fill="#15803d" transform="rotate(-90 40 330)">HTTP válido</text>

  <!-- Bridge -> Suricata (captura) -->
  <line x1="290" y1="512" x2="290" y2="390" stroke="#0284c7" stroke-width="4.5" stroke-dasharray="11,6" marker-end="url(#arr-blue)"/>
  <text x="305" y="460" font-size="21" font-weight="bold" fill="#0284c7">AF_PACKET</text>

  <!-- Agente -> Bridge (DROP en iptables) -->
  <line x1="640" y1="385" x2="640" y2="510" stroke="#b91c1c" stroke-width="4.5" stroke-dasharray="11,6" marker-end="url(#arr-red)"/>
  <text x="628" y="460" text-anchor="end" font-size="21" font-weight="bold" fill="#b91c1c">Regla DROP</text>

  <!-- Prometheus scrapea al Agente vía gateway -->
  <line x1="880" y1="496" x2="880" y2="390" stroke="#0f2942" stroke-width="4.5" marker-end="url(#arr-dark)"/>
  <text x="866" y="460" text-anchor="end" font-size="21" font-weight="bold" fill="#0f2942">scrape :8000</text>

  <!-- Fila 2: Bridge del kernel -->
  <rect x="30" y="515" width="920" height="110" rx="14" fill="#0f2942" stroke="#0284c7" stroke-width="4.5"/>
  <text x="430" y="560" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">Bridge br-monitored · 172.28.0.0/16</text>
  <text x="430" y="602" text-anchor="middle" font-size="22" font-weight="bold" fill="#93c5fd">iptables FORWARD / DOCKER-USER + br_netfilter</text>
  <rect x="805" y="496" width="150" height="40" rx="10" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
  <text x="880" y="523" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">GW .0.1</text>

  <!-- Cables bridge -> contenedores -->
  <line x1="142" y1="625" x2="142" y2="700" stroke="#475569" stroke-width="5"/>
  <line x1="374" y1="625" x2="374" y2="700" stroke="#475569" stroke-width="5"/>
  <line x1="606" y1="625" x2="606" y2="700" stroke="#475569" stroke-width="5"/>
  <line x1="838" y1="625" x2="838" y2="700" stroke="#475569" stroke-width="5"/>

  <!-- Fila 3: contenedores conectados al bridge -->
  <rect x="30" y="700" width="224" height="160" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="4"/>
  <text x="142" y="745" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2942">Atacante</text>
  <text x="142" y="785" text-anchor="middle" font-size="22" font-weight="bold" fill="#b91c1c">172.28.0.99</text>
  <text x="142" y="825" text-anchor="middle" font-size="20" fill="#334155">curl · SQLi · LFI</text>

  <rect x="262" y="700" width="224" height="160" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="374" y="745" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2942">Víctima</text>
  <text x="374" y="785" text-anchor="middle" font-size="22" font-weight="bold" fill="#0284c7">172.28.0.10:80</text>
  <text x="374" y="825" text-anchor="middle" font-size="20" fill="#334155">Nginx (Alpine)</text>

  <rect x="494" y="700" width="224" height="160" rx="14" fill="#ffffff" stroke="#0f2942" stroke-width="4"/>
  <text x="606" y="745" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2942">Prometheus</text>
  <text x="606" y="785" text-anchor="middle" font-size="22" font-weight="bold" fill="#0284c7">172.28.0.20:9090</text>
  <text x="606" y="825" text-anchor="middle" font-size="20" fill="#334155">métricas cada 2 s</text>

  <rect x="726" y="700" width="224" height="160" rx="14" fill="#ffffff" stroke="#0f2942" stroke-width="4"/>
  <text x="838" y="745" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f2942">Grafana</text>
  <text x="838" y="785" text-anchor="middle" font-size="22" font-weight="bold" fill="#0284c7">172.28.0.30:3000</text>
  <text x="838" y="825" text-anchor="middle" font-size="20" fill="#334155">dashboard NOC</text>

  <!-- Atacante -> Víctima (mismo segmento L2) -->
  <path d="M 142 860 L 142 905 L 374 905 L 374 866" fill="none" stroke="#b91c1c" stroke-width="4.5" marker-end="url(#arr-red)"/>
  <text x="258" y="945" text-anchor="middle" font-size="21" font-weight="bold" fill="#b91c1c">HTTP malicioso (vía bridge)</text>

  <!-- Grafana -> Prometheus (consultas) -->
  <path d="M 838 860 L 838 905 L 606 905 L 606 866" fill="none" stroke="#0f2942" stroke-width="4.5" marker-end="url(#arr-dark)"/>
  <text x="722" y="945" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f2942">PromQL</text>

  <!-- Leyenda -->
  <line x1="40" y1="1010" x2="95" y2="1010" stroke="#475569" stroke-width="5"/>
  <text x="105" y="1018" font-size="20" fill="#334155">cable al bridge</text>
  <line x1="280" y1="1010" x2="335" y2="1010" stroke="#0284c7" stroke-width="4.5" stroke-dasharray="11,6"/>
  <text x="345" y="1018" font-size="20" fill="#334155">captura / API</text>
  <line x1="510" y1="1010" x2="565" y2="1010" stroke="#b91c1c" stroke-width="4.5" stroke-dasharray="11,6"/>
  <text x="575" y="1018" font-size="20" fill="#334155">bloqueo iptables</text>
  <text x="490" y="1062" text-anchor="middle" font-size="18" fill="#475569">Zona punteada: Suricata y Agente usan la red del host; Prometheus llega al Agente por el gateway.</text>
</svg>
